# Species table for NEMO records. Edit freely: the harvester reads this file, nothing is hard-coded.
#
# groups:      how records are bucketed on the dashboard. Anything not listed here keeps the group
#              NEMO itself gives the record (Dolphin, Jellyfish, Birds and so on).
# gelatinous:  drifter      = arrives on wind and surface current (siphonophores, by-the-wind-sailors)
#              water_column = builds in place (true jellyfish, salps, comb jellies)
# invasive:    established  = breeding here, recorded repeatedly
#              emerging     = recorded in more than one year, not yet clearly established
#              watch        = recorded once or twice, or expected but not yet confirmed
# stinging:    species that matter for swimmers, used for the beach-facing wording
#
# Names: NEMO names a species relative to its group, so a common dolphin is "Common" and a fin whale
# is "Fin". Those short names collide: "Blue" is a blue whale under Whales and a blue shark under
# Sharks. Write an entry as "Group|Species" to match only inside that group. A bare name still
# matches any group, which is fine wherever the name is unambiguous.

gelatinous:
  drifter:
    - Jellyfish|Portuguese Man O' War
    - Jellyfish|By-the-wind-sailor
    - Jellyfish|Blue button
    - Abylopsis tetragona
    - Nemsignis banyulensis
  water_column:
    - Jellyfish|Mauve stinger
    - Rhizostoma luteum
    - Rhizostoma pulmo
    - Jellyfish|Fried Egg
    - Jellyfish|Stinging Cauliflower
    - Jellyfish|Moon                 # the jellyfish, not Moon Crab
    - Jellyfish|Compass
    - Jellyfish|Egg-yolk jellyfish
    - Castostylus tagi
    - Jellyfish|Comb jellyfish
    - Salpa maxima
    - Twin-sailed salp
    - Pyrosoma atlanticum

stinging:
  - Jellyfish|Mauve stinger
  - Jellyfish|Portuguese Man O' War
  - Jellyfish|Stinging Cauliflower
  - Jellyfish|Compass
  - Jellyfish|Fried Egg

# Status is your call, not the harvester's. A species listed here appears on the invasive watch card
# even before it is ever recorded, so people know what to look for.
invasive:
  Marine Invertebrates|Blue crab: established           # Callinectes sapidus, recorded every year since 2021
  Marine Invertebrates|Sally light-foot: emerging       # Percnon gibbesi
  Marine Invertebrates|Veined rapa whelk: emerging      # Rapana venosa
  Fish|Silver-cheeked toadfish: watch   # Lagocephalus sceleratus, toxic
  Jellyfish|Comb jellyfish: watch            # check whether Mnemiopsis leidyi (invasive) or native Beroe
  Marine Invertebrates|Moon Crab: watch
  Fish|Round Sardinella: watch
  Fish|Mediterranean Parrotfish: watch  # range expanding with warming, not invasive as such
  # Not yet recorded in NEMO, listed so a first record raises a flag:
  Lionfish: watch
  Devil firefish: watch
  Atlantic blue crab: watch
  Rugulopteryx okamurae: watch

# Species that should never be published at full precision, whatever the record says.
sensitive:
  - Dolphin|Orca
  - Whales|Sperm
  - Whales|Fin
  - Whales|Blue                      # the whale; blue sharks are recorded as Sharks|Blue
  - Whales|Humpback
  - Whales|Minke
  - Turtle|Loggerhead
  - Turtle|Leatherback
  - Turtle|Green
  - Sharks|Basking
