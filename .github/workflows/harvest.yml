name: Daily harvest

on:
  schedule:
    - cron: "7 3 * * *"       # 03:07 UTC (05:07 Gibraltar summer, 04:07 winter); off the hour, when GitHub is less busy
  workflow_dispatch:
    inputs:
      restore_key:
        description: "Only for recovery: exact cache key of a database to start from (blank = newest)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tnp-harvester
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
  COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
  EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
  EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
  ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
  # Private links to the NEMO export and the TNP strandings log. Without these the wildlife
  # section is skipped, so the run still succeeds but the dashboard has no sightings on it.
  NEMO_CSV_URL: ${{ secrets.NEMO_CSV_URL }}
  STRANDINGS_URL: ${{ secrets.STRANDINGS_URL }}
  # Global Fishing Watch. Without it the fishing source skips itself and the run still
  # succeeds, so an expired token shows up as an empty Marine traffic tab, not a failure.
  GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      published: ${{ steps.publish.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Offline tests
        run: python -m unittest discover -s tests

      # Without a DATABASE_URL secret the harvester uses SQLite, kept between runs in the Actions cache.
      - name: Restore SQLite database
        id: restore
        if: env.DATABASE_URL == ''
        uses: actions/cache/restore@v4
        with:
          path: data/tnp_ocean.db
          key: ${{ github.event.inputs.restore_key || format('tnp-db-{0}', github.run_id) }}
          restore-keys: tnp-db-

      - name: Harvest new data
        id: harvest
        run: python harvest.py update --max-minutes 240

      # Everything below only runs if the database was really loaded (never after a failed test step),
      # so a broken run can never replace the stored history with an empty database.
      - name: Export dashboard JSON
        id: export
        if: always() && steps.harvest.outcome != 'skipped'
        run: python harvest.py export && python harvest.py status

      - name: Save SQLite database
        if: always() && env.DATABASE_URL == '' && steps.harvest.outcome != 'skipped' && hashFiles('data/tnp_ocean.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/tnp_ocean.db
          key: tnp-db-${{ github.run_id }}

      - name: Keep a backup copy of the database (30 days)
        if: always() && env.DATABASE_URL == '' && steps.harvest.outcome != 'skipped' && hashFiles('data/tnp_ocean.db') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tnp-db-backup
          path: data/tnp_ocean.db
          retention-days: 30

      # TNP-only: sightings with the sea conditions attached, and stranding candidates.
      # Downloadable from this run's page, never published to the website.
      - name: Keep the private wildlife files (90 days)
        if: always() && steps.export.outcome == 'success' && hashFiles('private/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tnp-wildlife-private
          path: private
          retention-days: 90

      - name: Publish dashboard data to GitHub Pages
        id: publish
        if: always() && steps.export.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: harvest
    if: always() && needs.harvest.outputs.published == 'success'
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
