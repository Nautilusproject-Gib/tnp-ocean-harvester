name: Historical backfill

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source code(s) from config.yaml, separated by spaces or commas (blank = all)"
        required: false
        default: ""
      start:
        description: "Earliest date to reach, YYYY-MM-DD (blank = as far back as each source allows)"
        required: false
        default: ""
      end:
        description: "Latest date to reach, YYYY-MM-DD (blank = carry on from where the source got to)"
        required: false
        default: ""
      max_minutes:
        description: "Stop starting new chunks after this many minutes"
        required: false
        default: "300"
      restore_key:
        description: "Only for recovery: exact cache key of a database to start from (blank = newest)"
        required: false
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: tnp-harvester
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
  COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
  EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
  EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
  ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
  # Private links to the NEMO export and the TNP strandings log. Without these the wildlife
  # section is skipped, so the run still succeeds but the dashboard has no sightings on it.
  NEMO_CSV_URL: ${{ secrets.NEMO_CSV_URL }}
  STRANDINGS_URL: ${{ secrets.STRANDINGS_URL }}
  # Global Fishing Watch. Without it the fishing source skips itself and the run still
  # succeeds, so an expired token shows up as an empty Marine traffic tab, not a failure.
  GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore SQLite database
        if: env.DATABASE_URL == ''
        uses: actions/cache/restore@v4
        with:
          path: data/tnp_ocean.db
          key: ${{ github.event.inputs.restore_key || format('tnp-db-{0}', github.run_id) }}
          restore-keys: tnp-db-

      - name: Backfill
        id: backfill
        env:
          IN_SOURCE: ${{ github.event.inputs.source }}
          IN_START: ${{ github.event.inputs.start }}
          IN_END: ${{ github.event.inputs.end }}
          IN_MAX: ${{ github.event.inputs.max_minutes || '300' }}
        run: |
          ARGS="--max-minutes $IN_MAX"
          for S in ${IN_SOURCE//,/ }; do ARGS="$ARGS --source $S"; done
          if [ -n "$IN_START" ]; then ARGS="$ARGS --start $IN_START"; fi
          if [ -n "$IN_END" ]; then ARGS="$ARGS --end $IN_END"; fi
          python harvest.py backfill $ARGS

      - name: Status
        if: always() && steps.backfill.outcome != 'skipped'
        run: python harvest.py status

      - name: Save SQLite database
        id: save
        if: always() && env.DATABASE_URL == '' && steps.backfill.outcome != 'skipped' && hashFiles('data/tnp_ocean.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/tnp_ocean.db
          key: tnp-db-${{ github.run_id }}

      - name: Keep a backup copy of the database (30 days)
        if: always() && env.DATABASE_URL == '' && steps.backfill.outcome != 'skipped' && hashFiles('data/tnp_ocean.db') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tnp-db-backup
          path: data/tnp_ocean.db
          retention-days: 30

      # One database is ~2GB and every run saves a new copy, so a repo's 10GB of cache fills in
      # under a week and GitHub starts evicting entries on its own schedule. Deleting our older
      # copies here keeps exactly one, the one this run just saved. The 30 day artifact backup
      # above is the fallback if that copy ever turns out to be bad.
      - name: Delete older copies of the database cache
        # only when this run actually saved one: otherwise there is nothing to keep
        if: always() && steps.save.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: tnp-db-${{ github.run_id }}
        run: |
          LIST=$(gh cache list --limit 100 --json id,key --jq '.[] | "\(.id) \(.key)"')
          if ! echo "$LIST" | grep -q " $KEEP$"; then
            echo "this run's cache ($KEEP) is not listed yet, leaving the others alone"
            exit 0
          fi
          gh cache list --limit 100 --json id,key \
            --jq '.[] | select(.key | startswith("tnp-db-")) | "\(.id) \(.key)"' \
          | while read -r id key; do
              if [ "$key" != "$KEEP" ]; then
                echo "deleting $key"
                gh cache delete "$id" || true
              fi
            done
